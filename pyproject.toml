[project]
name = "Python-Study-App"
version = "0.1.0"
description = "コードを書いて実行・自動採点・AIフィードバックでPythonを身につける学習アプリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.31.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
    "streamlit-ace>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "runner", "ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["^exercises/", "^\\.claude/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.coverage.run]
# 子プロセス内でのみ実行されるため計測できない(動作は tests/test_sandbox.py で検証)
omit = ["runner/_launcher.py"]
