id: l4-005-load-config
title: 設定ファイルの読み込みと検証(json)
level: 4
topic: json
kind: write
grading: pytest
description: |
  ## やること
  JSON 形式の設定テキストを読み込み、検証して `Config` にする関数 `load_config(text)` を
  実装してください。不正な内容は、原因が分かるメッセージ付きの `ConfigError` にします。
  (`Config` と `ConfigError` は初期コードに定義済みです)

  ## 設定の形式
  ```json
  {"host": "localhost", "port": 8080, "debug": true, "allowed_hosts": ["a.example", "b.example"]}
  ```
  | キー | 必須 | 型・条件 | 省略時 |
  |---|---|---|---|
  | `host` | ○ | 空でない文字列 | - |
  | `port` | ○ | 整数で 1〜65535(`true` / `false` や `8080.0` は不可) | - |
  | `debug` | | 真偽値 | `False` |
  | `allowed_hosts` | | 文字列のリスト → `Config` ではタプルにする | `()` |

  ## エラーにするもの(`ConfigError` を送出)
  - JSON として読めない → 元の例外(`json.JSONDecodeError`)を原因として連結する(`raise ... from e`)
  - トップレベルがオブジェクト(`{...}`)でない
  - 上の表に無いキーがある(メッセージにそのキー名を含める)
  - 必須キーが無い・型や条件が違う(メッセージにそのキー名を含める)

  ## 例
  ```python
  >>> load_config('{"host": "localhost", "port": 8080}')
  Config(host='localhost', port=8080, debug=False, allowed_hosts=())
  >>> load_config('{"host": "localhost", "port": "8080"}')
  ConfigError: port は 1〜65535 の整数にしてください
  ```
starter_code: |
