id: l4-003-build-url
title: クエリ付きURLの組み立て(urllib.parse)
level: 4
topic: http
kind: write
grading: pytest
description: |
  ## やること
  APIを呼び出すためのURLを組み立てる関数 `build_url(base, path, params=None)` を実装してください。

  ## ルール
  - `base` と `path` は、間の `/` が **ちょうど1つ** になるようにつなぐ
    (`base` の末尾や `path` の先頭に `/` があってもなくてもよい)
  - `params` の内容をクエリ文字列にして `?` の後ろに付ける。順番は `params` の順
    - 値が `int` なら文字列にする
    - 値がリストなら、同じキーを要素の数だけ繰り返す(`tag=a&tag=b`)
    - 値が `None` のキーは含めない
    - キーと値は URL エンコードする。空白は `%20`、`/` は `%2F`、日本語は UTF-8 で `%E6%97%A5...` のように
  - クエリにする項目が無い(`params` が `None`・空・全部 `None`)なら `?` を付けない

  ## 例
  ```python
  >>> build_url("https://api.example.com/", "/v1/search", {"q": "python 3", "page": 2, "tag": ["web", "api"]})
  'https://api.example.com/v1/search?q=python%203&page=2&tag=web&tag=api'
  ```
starter_code: |
