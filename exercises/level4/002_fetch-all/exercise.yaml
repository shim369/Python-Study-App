id: l4-002-fetch-all
title: 同時実行数を制限した並行取得(asyncio)
level: 4
topic: asyncio
kind: write
grading: pytest
description: |
  ## やること
  複数のURLを **並行して** 取得する非同期関数 `fetch_all(urls, fetch, limit)` を実装してください。
  相手のサーバーに負担をかけないよう、**同時に実行する取得は最大 `limit` 件**に制限します。

  ## 引数
  - `urls`: 取得するURLのリスト
  - `fetch`: 1つのURLを取得する非同期関数(`await fetch(url)` で本文の文字列が返る)。
    テストでは通信の代わりに `asyncio.sleep` で待つ偽物が渡されます
  - `limit`: 同時に実行してよい `fetch` の最大数

  ## ルール
  - 戻り値は本文のリストで、**`urls` と同じ順番**(取得が終わった順ではない)
  - 同時実行数は `limit` を超えてはいけない。一方で、`limit` 件までは本当に並行して実行すること
    (1件ずつ順番に待つのは不可)
  - `urls` が空なら空のリスト
  - `limit` が 1 未満なら `ValueError`
  - `fetch` が例外を送出したら、その例外をそのまま送出してよい

  ## 例
  ```python
  >>> asyncio.run(fetch_all(["https://a.example", "https://b.example"], fetch, limit=2))
  ['<a の本文>', '<b の本文>']
  ```
