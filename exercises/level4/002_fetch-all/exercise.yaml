hints:
  - >-
    「全部まとめて並行に走らせ、順番どおりに結果を集める」部分と、「同時に走る数を制限する」部分に分けて考えましょう。どちらも asyncio に道具があります。
  - >-
    asyncio.gather(*コルーチン) は並行に実行し、結果を渡した順番どおりのリストで返します。同時実行数の制限には asyncio.Semaphore(limit) を async with で使います。
  - >-
    手順:limit をチェック → Semaphore を作る → 「async with semaphore: return await fetch(url)」だけをする内側の async 関数を定義 → 各 URL についてその関数を呼んだものを gather に渡して await → list にして返す。
solution: |
  import asyncio
  from collections.abc import Awaitable, Callable


  async def fetch_all(
      urls: list[str], fetch: Callable[[str], Awaitable[str]], limit: int
  ) -> list[str]:
      if limit < 1:
          raise ValueError("limit は 1 以上にしてください")
      semaphore = asyncio.Semaphore(limit)

      async def fetch_one(url: str) -> str:
          async with semaphore:  # 空きが出るまでここで待つ
              return await fetch(url)

      return list(await asyncio.gather(*(fetch_one(url) for url in urls)))
php_note: |
  PHPは基本的に1リクエスト1スレッドで同期的に動くため、並行HTTP取得には
  `curl_multi_*` や Guzzle の Promise(`Pool` の `concurrency` オプション)を使います。
  Pythonの `asyncio` は言語レベルの `async` / `await` で同じことを書けます。
  `Semaphore` は「同時に入れる人数が決まった部屋」のようなもので、Guzzle Pool の
  concurrency に相当します。
tags: [asyncio, concurrency, semaphore]
