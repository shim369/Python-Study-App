  import sys
  from pathlib import Path


  def main(argv: list[str] | None = None) -> int:
      # ここに実装
      raise NotImplementedError


  if __name__ == "__main__":
      sys.exit(main())
hints:
  - >-
    「引数の定義と解析」と「数えて表示する処理」を分けて考えましょう。引数の解析は argparse.ArgumentParser に任せ、自分で sys.argv を読まないのがポイントです。
  - >-
    add_argument("files", nargs="+") で1つ以上の位置引数、add_argument("-l", "--lines", action="store_true") でフラグになります。parse_args(argv) にリストを渡すとテストしやすくなります。エラー出力は print(..., file=sys.stderr) です。
  - >-
    手順:parser を作って parse_args(argv) → 「行数を表示するか」= lines が指定された or words が指定されていない(単語数も同様)→ ファイルごとに read_text、FileNotFoundError なら stderr に出して終了コードを 1 に → 表示する数を並べて print → 終了コードを返す。
solution: |
  import argparse
  import sys
  from pathlib import Path


  def build_parser() -> argparse.ArgumentParser:
      parser = argparse.ArgumentParser(prog="pywc", description="行数と単語数を数える")
      parser.add_argument("files", nargs="+", help="対象のテキストファイル")
      parser.add_argument("-l", "--lines", action="store_true", help="行数だけ表示する")
      parser.add_argument("-w", "--words", action="store_true", help="単語数だけ表示する")
      return parser


  def main(argv: list[str] | None = None) -> int:
      args = build_parser().parse_args(argv)
      show_lines = args.lines or not args.words
      show_words = args.words or not args.lines

      exit_code = 0
      for name in args.files:
          try:
              text = Path(name).read_text(encoding="utf-8")
          except FileNotFoundError:
              print(f"error: ファイルが見つかりません: {name}", file=sys.stderr)
              exit_code = 1
              continue
          counts = []
          if show_lines:
              counts.append(len(text.splitlines()))
          if show_words:
              counts.append(len(text.split()))
          print(*counts, name)
      return exit_code


  if __name__ == "__main__":
      sys.exit(main())
php_note: |
  PHPでは `$argv` を自分で解析するか `getopt()` を使いますが、`getopt()` はヘルプの生成や
  型の変換をしてくれません。Pythonの `argparse` は `--help` の自動生成・必須引数のチェック・
  エラーメッセージまで面倒を見てくれます。
  `main(argv)` が引数のリストを受け取る形にしておくと、テストから直接呼べるのが実務上のコツです。
tags: [cli, argparse, pathlib, testing]
en:
  title: A line and word counting CLI (argparse)
  description: |
    ## Task
    Using the standard library's `argparse`, implement `main(argv)`, the core of a command-line tool
    that prints the number of lines and words in text files.

    ```
    $ python pywc.py a.txt b.txt
    3 10 a.txt
    1 2 b.txt
    $ python pywc.py -l a.txt
    3 a.txt
    ```

    ## Specification
    - Arguments: one or more file names (zero is an argparse error)
    - Options: `-l` / `--lines` (line count only), `-w` / `--words` (word count only)
      - If neither or both are given, show both "lines words"
    - Output: one line per file, `{lines} {words} {file name}` to standard output (omit the items not shown)
      - Show the file name exactly as given in the arguments
      - The line count is the number of items from `str.splitlines()`, the word count from `str.split()` (files are UTF-8)
    - For a file that doesn't exist, print exactly `error: ファイルが見つかりません: {file name}` to standard error
      (the Japanese text means "file not found"; the tests check this exact string) and move on to the next file
    - Return value (exit code): `0` if every file was read, `1` if any file couldn't be read
    - argparse errors (unknown options etc.) may raise `SystemExit` as argparse normally does

    The tests call it with a list of arguments, like `main(["-l", "a.txt"])`.
    When `argv` is `None`, argparse uses the command-line arguments (`sys.argv[1:]`).
  hints:
    - >-
      Think of "defining and parsing the arguments" and "counting and printing" separately. The key is to leave argument
      parsing to argparse.ArgumentParser instead of reading sys.argv yourself.
    - >-
      add_argument("files", nargs="+") gives one or more positional arguments, and add_argument("-l", "--lines",
      action="store_true") gives a flag. Passing a list to parse_args(argv) makes it easy to test. Print errors with
      print(..., file=sys.stderr).
    - >-
      Steps: build the parser and parse_args(argv) → "show the line count" = lines given or words not given (same for words)
      → read_text each file; on FileNotFoundError, print to stderr and set the exit code to 1 → print the numbers to show
      → return the exit code.
  php_note: |
    In PHP you parse `$argv` yourself or use `getopt()`, but `getopt()` doesn't generate help or
    convert types. Python's `argparse` takes care of auto-generating `--help`, checking required arguments,
    and even error messages.
    A practical tip: making `main(argv)` take the argument list lets tests call it directly.
  starter_code: |
    import argparse
    import sys
    from pathlib import Path


    def main(argv: list[str] | None = None) -> int:
        # Implement here
        raise NotImplementedError


    if __name__ == "__main__":
        sys.exit(main())
