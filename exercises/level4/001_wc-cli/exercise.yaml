id: l4-001-wc-cli
title: 行数・単語数を数えるCLI(argparse)
level: 4
topic: cli
kind: write
grading: pytest
description: |
  ## やること
  テキストファイルの行数と単語数を表示するコマンドラインツールの本体
  `main(argv)` を、標準ライブラリの `argparse` で実装してください。

  ```
  $ python pywc.py a.txt b.txt
  3 10 a.txt
  1 2 b.txt
  $ python pywc.py -l a.txt
  3 a.txt
  ```

  ## 仕様
  - 引数: ファイル名を1つ以上(0個なら argparse のエラー)
  - オプション: `-l` / `--lines`(行数だけ)、`-w` / `--words`(単語数だけ)
    - どちらも指定しない、または両方指定したときは「行数 単語数」の両方
  - 出力: ファイルごとに1行、`{行数} {単語数} {ファイル名}` を標準出力へ(表示しない項目は省く)
    - ファイル名は引数で指定されたとおりに表示する
    - 行数は `str.splitlines()` の要素数、単語数は `str.split()` の要素数(ファイルは UTF-8)
  - 存在しないファイルは、標準エラーに `error: ファイルが見つかりません: {ファイル名}` を出して
    次のファイルへ進む
  - 戻り値(終了コード): すべて読めたら `0`、1つでも読めないファイルがあれば `1`
  - argparse のエラー(未知のオプションなど)は argparse の標準どおり `SystemExit` でよい

  テストでは `main(["-l", "a.txt"])` のように引数のリストを渡して呼び出します。
  `argv` が `None` のときは、argparse がコマンドラインの引数(`sys.argv[1:]`)を使います。
starter_code: |
