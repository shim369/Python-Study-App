id: l3-005-access-log
title: アクセスログの解析(re)
level: 3
topic: re
kind: write
grading: pytest
description: |
  ## やること
  Webサーバーのアクセスログ1行を解析し、`LogEntry` にして返す関数
  `parse_access_log(line)` を実装してください。形式に合わない行は `None` を返します。

  ## ログの形式
  ```
  127.0.0.1 - - [20/Oct/2026:10:15:32 +0900] "GET /index.html HTTP/1.1" 200 1534
  ```
  空白区切りで、左から順に
  1. IPアドレス(空白を含まない文字列)
  2. `-` などの2つの項目(空白を含まない文字列。使わない)
  3. `[` と `]` で囲まれた日時(使わない)
  4. `"` で囲まれたリクエスト:`メソッド(英大文字) パス(空白を含まない) プロトコル`
  5. ステータスコード(数字3桁)
  6. レスポンスサイズ(数字。データがないときは `-`)

  ## ルール
  - `status` と `size` は `int` にする。サイズが `-` なら `0`
  - 行末の改行や前後の空白は無視する
  - 行全体が形式に合わない場合(項目が足りない・余計な文字がある・ステータスが数字3桁でない等)は `None`

  ## 例
  ```python
  >>> parse_access_log('127.0.0.1 - - [20/Oct/2026:10:15:32 +0900] "GET /index.html HTTP/1.1" 200 1534')
  LogEntry(ip='127.0.0.1', method='GET', path='/index.html', status=200, size=1534)
  ```
