hints:
  - >-
    split で区切ると、日時やリクエストの中の空白で崩れてしまいます。行全体の形を正規表現で表しましょう。
  - >-
    名前付きグループ (?P<名前>...) を使うと、取り出した値を match["名前"] で読めます。行全体に一致したかどうかは re.fullmatch で判定でき、パターンは re.compile でモジュールの定数にしておくのが定番です。\S+ は「空白以外の1文字以上」です。
  - >-
    手順:ip・method・path・status・size の名前付きグループを持つパターンを compile(日時は \[[^\]]+\]、status は \d{3}、size は \d+|-)→ line.strip() に fullmatch → None なら None を返す → int に変換して LogEntry を作る。
solution: |
  import re
  from dataclasses import dataclass


  @dataclass(frozen=True)
  class LogEntry:
      ip: str
      method: str
      path: str
      status: int
      size: int


  LOG_PATTERN = re.compile(
      r"(?P<ip>\S+) \S+ \S+ \[[^\]]+\] "
      r'"(?P<method>[A-Z]+) (?P<path>\S+) [^"]+" '
      r"(?P<status>\d{3}) (?P<size>\d+|-)"
  )


  def parse_access_log(line: str) -> LogEntry | None:
      match = LOG_PATTERN.fullmatch(line.strip())
      if match is None:
          return None
      size = match["size"]
      return LogEntry(
          ip=match["ip"],
          method=match["method"],
          path=match["path"],
          status=int(match["status"]),
          size=0 if size == "-" else int(size),
      )
php_note: |
  PHPの `preg_match('/(?P<ip>\S+) .../', $line, $m)` と同じ名前付きグループが使えます。
  違いは、Pythonでは区切り文字(`/.../`)を書かず、raw文字列 `r"..."` でバックスラッシュを
  そのまま書く点です。行全体の一致は、PHPでは `^...$` を付けますが、Pythonでは
  `re.fullmatch` を使うと意図が明確になります(`$` は末尾の改行の手前にも一致するので注意)。
tags: [re, regex, dataclass]
