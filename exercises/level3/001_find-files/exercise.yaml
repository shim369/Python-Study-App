  def find_files(root: Path, suffix: str, min_bytes: int = 0) -> list[str]:
      # ここに実装
      raise NotImplementedError
hints:
  - >-
    os.walk や文字列の結合を使わなくても、pathlib.Path のメソッドだけで「再帰的に探す」「拡張子を見る」「サイズを見る」「相対パスにする」が全部できます。
  - >-
    Path.rglob("*") で配下を再帰的に列挙できます。is_file()、suffix、stat().st_size、relative_to(root)、as_posix() を調べてみましょう。
  - >-
    手順:root.rglob("*") でループ → is_file() で、suffix を lower() したものが一致し、stat().st_size が min_bytes 以上のものだけ残す → relative_to(root).as_posix() で文字列にする → sorted して返す。
solution: |
  from pathlib import Path


  def find_files(root: Path, suffix: str, min_bytes: int = 0) -> list[str]:
      matches = (
          path
          for path in root.rglob("*")
          if path.is_file()
          and path.suffix.lower() == suffix.lower()
          and path.stat().st_size >= min_bytes
      )
      return sorted(path.relative_to(root).as_posix() for path in matches)
php_note: |
  PHPでは `RecursiveIteratorIterator` + `RecursiveDirectoryIterator` や `glob()` と
  `pathinfo()`、`filesize()` などの関数を組み合わせますが、Pythonの `pathlib.Path` は
  パスをオブジェクトとして扱い、`path.suffix` や `path.stat()` のようにメソッドで操作します。
  `root / "docs" / "a.txt"` のように `/` 演算子でパスを結合できるのも特徴です。
