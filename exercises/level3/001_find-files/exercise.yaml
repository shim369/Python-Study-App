id: l3-001-find-files
title: ファイルを探す(pathlib)
level: 3
topic: pathlib
kind: write
grading: pytest
description: |
  ## やること
  ディレクトリ `root` の中(サブディレクトリも含む)から条件に合うファイルを探し、
  `root` からの相対パスの一覧を返す関数 `find_files(root, suffix, min_bytes=0)` を実装してください。

  ## ルール
  - 拡張子が `suffix`(例: `".txt"`)のファイルだけを対象にする。拡張子の大文字・小文字は区別しない
    - 拡張子は最後の `.` 以降(`"archive.tar.gz"` の拡張子は `".gz"`)
  - ファイルサイズが `min_bytes` バイト以上のものだけを対象にする
  - ディレクトリは対象外(名前が `notes.txt` のディレクトリがあっても含めない)
  - 戻り値は `root` からの相対パスを **`/` 区切りの文字列**にしたもの(例: `"docs/a.txt"`)を、昇順に並べたリスト

  ## 例
  ```
  root/
  ├── a.txt          (10バイト)
  ├── b.md
  └── docs/
      └── c.TXT      (0バイト)
  ```
  ```python
  >>> find_files(root, ".txt")
  ['a.txt', 'docs/c.TXT']
  >>> find_files(root, ".txt", min_bytes=1)
  ['a.txt']
  ```
starter_code: |
