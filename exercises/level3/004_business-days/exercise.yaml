hints:
  - >-
    期間の1日ずつを順に作り、「平日か」「祝日でないか」を判定して数えましょう。日付の足し算には専用の型があります。
  - >-
    date 同士の引き算は timedelta になり、.days で日数が取れます。曜日は date.weekday()(月曜が 0、日曜が 6)です。祝日の判定を速くするため、holidays は set にしておきます。
  - >-
    手順:holidays を set に → (end - start).days + 1 回ループして start + timedelta(days=n) を作る(負なら range は空になる)→ weekday() が 5 未満で、祝日に含まれない日を数える。
solution: |
  from collections.abc import Iterable
  from datetime import date, timedelta


  def count_business_days(start: date, end: date, holidays: Iterable[date] = ()) -> int:
      closed = set(holidays)
      days = (start + timedelta(days=n) for n in range((end - start).days + 1))
      return sum(1 for day in days if day.weekday() < 5 and day not in closed)
php_note: |
  PHPの `DateTime::modify('+1 day')` は元のオブジェクトを書き換えますが(`DateTimeImmutable` を除く)、
  Pythonの `date` は不変で、`day + timedelta(days=1)` は新しい日付を返します。
  曜日は PHPの `format('N')`(月曜=1)と違い、`weekday()` は月曜=0 です
  (`isoweekday()` なら月曜=1)。
