id: l3-004-business-days
title: 営業日を数える(datetime)
level: 3
topic: datetime
kind: write
grading: pytest
description: |
  ## やること
  期間 `start` 〜 `end`(**両端を含む**)の営業日の数を返す関数
  `count_business_days(start, end, holidays=())` を実装してください。

  ## ルール
  - 営業日は月曜〜金曜のうち、`holidays` に含まれない日
  - `holidays` は `date` のイテラブル(リストでも集合でもよい)。土日の祝日が入っていてもよい
  - `start` が `end` より後なら `0` を返す

  ## 例
  2026年10月19日は月曜日です。
  ```python
  >>> count_business_days(date(2026, 10, 19), date(2026, 10, 25))   # 月〜日
  5
  >>> count_business_days(date(2026, 10, 19), date(2026, 10, 23), [date(2026, 10, 21)])
  4
  ```
