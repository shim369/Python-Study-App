id: l1-004-unique-tags
title: タグの重複除去
level: 1
topic: set
kind: write
grading: pytest
description: |
  ## やること
  ブログ記事に付けるタグのリスト `tags` を整理する関数 `unique_tags(tags)` を実装してください。

  ## ルール
  - 各タグの前後の空白を取り除く
  - 空白を取り除いた結果が空文字列になるタグは捨てる
  - 大文字・小文字だけが違うタグは**同じタグ**とみなし、**最初に出てきた表記**を残す
  - 結果は、最初に出てきた順番を保つ
  - 引数のリストは変更しない

  ## 例
  ```python
  >>> unique_tags(["Python", " php ", "python", "PHP", "", "Go"])
  ['Python', 'php', 'Go']
  ```
starter_code: |
  def unique_tags(tags: list[str]) -> list[str]:
      # ここに実装
      raise NotImplementedError
hints:
  - >-
    「もう出てきたタグか?」を素早く調べるための入れ物を、結果のリストとは別に用意しましょう。
  - >-
    「含まれているか」の判定は set が得意です(リストより速い)。比較用のキーは小文字に揃えた文字列にします。
  - >-
    手順:見たキーの set と結果のリストを用意 → 各タグを strip → 空なら飛ばす → lower() したキーが set に無ければ、set に追加して結果に append → 最後に結果を返す。
solution: |
  def unique_tags(tags: list[str]) -> list[str]:
      seen: set[str] = set()
      result: list[str] = []
      for tag in tags:
          tag = tag.strip()
          key = tag.lower()
          if tag and key not in seen:
              seen.add(key)
              result.append(tag)
      return result
php_note: |
  PHPの `array_unique()` に近いですが、大文字小文字を無視するには自分で比較用のキーを作ります。
  PHPでは `isset($seen[$key])` を「集合」の代わりに使いますが、Pythonには専用の型 `set` があり、
  `key in seen` の判定は要素数に関係なくほぼ一定時間で済みます。
tags: [set, list, string]
en:
  title: Removing duplicate tags
  description: |
    ## Task
    Implement a function `unique_tags(tags)` that cleans up a list `tags` of blog post tags.

    ## Rules
    - Remove whitespace from both ends of each tag
    - Drop tags that become an empty string after removing whitespace
    - Tags that differ only in case are **the same tag**; keep **the spelling that appears first**
    - Keep the order in which tags first appear
    - Don't modify the list passed as the argument

    ## Example
    ```python
    >>> unique_tags(["Python", " php ", "python", "PHP", "", "Go"])
    ['Python', 'php', 'Go']
    ```
  hints:
    - >-
      Besides the result list, prepare a container for quickly checking "have I already seen this tag?".
    - >-
      A set is good at checking "is it included?" (faster than a list). Use the lowercased string
      as the key for comparison.
    - >-
      Steps: prepare a set of seen keys and a result list → strip each tag → skip if empty →
      if the lower() key is not in the set, add it to the set and append the tag to the result → return the result.
  php_note: |
    It's close to PHP's `array_unique()`, but to ignore case you build the comparison key yourself.
    In PHP you'd use `isset($seen[$key])` as a stand-in for a "set", but Python has a dedicated type `set`,
    and checking `key in seen` takes roughly constant time regardless of the number of elements.
