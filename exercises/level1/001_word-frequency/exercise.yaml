id: l1-001-word-frequency
title: 単語の出現回数
level: 1
topic: dict
kind: write
grading: pytest
description: |
  ## やること
  文字列 `text` に含まれる単語ごとの出現回数を数え、`{単語: 回数}` の辞書で返す
  関数 `word_frequency(text)` を実装してください。

  ## ルール
  - 単語は空白(スペース・タブ・改行)で区切られたもの
  - 大文字・小文字は区別しない(キーは**小文字**にする)
  - 各単語の**前後**についた記号 `.` `,` `!` `?` は取り除く(`"hello!"` → `"hello"`)
  - 記号を取り除いた結果が空になったものは数えない
  - `text` が空文字列なら空の辞書 `{}` を返す

  ## 例
  ```python
  >>> word_frequency("The cat and the hat.")
  {'the': 2, 'cat': 1, 'and': 1, 'hat': 1}
  ```
starter_code: |
