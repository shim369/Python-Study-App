id: l2-004-override-env
title: 環境変数を一時的に変える
level: 2
topic: context-manager
kind: write
grading: pytest
description: |
  ## やること
  `with` ブロックの中だけ環境変数を書き換え、ブロックを抜けたら元に戻す
  コンテキストマネージャ `override_env(**values)` を実装してください。

  ```python
  with override_env(APP_ENV="test", DEBUG=None):
      ...  # この中では APP_ENV="test"、DEBUG は存在しない
  # ここでは元どおり
  ```

  ## ルール
  - 値が文字列のキーは、その値を `os.environ` に設定する
  - 値が `None` のキーは、`os.environ` から削除する(元から無ければ何もしない)
  - ブロックを抜けたら **元の状態に正確に戻す**
    - 元の値があったキーは元の値に戻す
    - 元々存在しなかったキーは削除する
  - ブロック内で例外が起きても元に戻し、例外はそのまま伝える
  - 指定していないキーには触らない

  初期コードの `@contextmanager` を使うと、`yield` の前が「入るとき」、後が「出るとき」の
  処理になります。
starter_code: |
  import os
  from collections.abc import Iterator
  from contextlib import contextmanager


  @contextmanager
  def override_env(**values: str | None) -> Iterator[None]:
      # ここに実装
      raise NotImplementedError
hints:
  - >-
    書き換える前に「元の状態」を覚えておき、出るときにそれを書き戻す、という形にしましょう。「元々無かった」ことも覚えておく必要があります。
  - >-
    os.environ.get(key) は無ければ None を返すので、「元の状態」を values と同じ形({キー: 値 or None})で保存できます。例外が起きても必ず戻すには try / finally を使います。
  - >-
    手順:{key: os.environ.get(key) for key in values} で元の状態を保存 → try の中で values を適用して yield → finally で保存した状態を適用。「適用」は None なら pop(key, None)、それ以外は代入、という小さな関数にすると2回使えます。
solution: |
  import os
  from collections.abc import Iterator
  from contextlib import contextmanager


  @contextmanager
  def override_env(**values: str | None) -> Iterator[None]:
      saved = {key: os.environ.get(key) for key in values}
      try:
          _apply(values)
          yield
      finally:
          _apply(saved)


  def _apply(values: dict[str, str | None]) -> None:
      for key, value in values.items():
          if value is None:
              os.environ.pop(key, None)
          else:
              os.environ[key] = value
php_note: |
  PHPには `with` 文がなく、後片付けは `try { ... } finally { ... }` を毎回書きます。
  Pythonのコンテキストマネージャは「準備と後片付け」を1か所にまとめて再利用できる仕組みで、
  ファイル(`with open(...)`)やDB接続、ロックなどで日常的に使います。
tags: [context-manager, contextlib, os]
en:
  title: Temporarily changing environment variables
  description: |
    ## Task
    Implement a context manager `override_env(**values)` that changes environment variables only inside a
    `with` block and restores them when the block is exited.

    ```python
    with override_env(APP_ENV="test", DEBUG=None):
        ...  # in here, APP_ENV="test" and DEBUG doesn't exist
    # back to the original state here
    ```

    ## Rules
    - For keys whose value is a string, set that value in `os.environ`
    - For keys whose value is `None`, delete them from `os.environ` (do nothing if they didn't exist)
    - On leaving the block, **restore the original state exactly**
      - Keys that had a value get their original value back
      - Keys that didn't exist originally are deleted
    - Restore even if an exception occurs inside the block, and let the exception propagate as is
    - Don't touch keys that weren't specified

    With the `@contextmanager` in the starter code, the code before `yield` runs "on enter" and
    the code after it runs "on exit".
  hints:
    - >-
      Remember the "original state" before changing anything, and write it back on exit. You also need to
      remember that a key "didn't exist originally".
    - >-
      os.environ.get(key) returns None when the key is missing, so you can save the "original state" in the same
      shape as values ({key: value or None}). Use try / finally to restore even when an exception occurs.
    - >-
      Steps: save the original state with {key: os.environ.get(key) for key in values} → apply values inside try and yield
      → apply the saved state in finally. Making "apply" a small function (pop(key, None) for None, assignment otherwise)
      lets you use it twice.
  php_note: |
    PHP has no `with` statement, so you write `try { ... } finally { ... }` every time for cleanup.
    Python's context managers bundle "setup and cleanup" in one reusable place,
    and they're used every day for files (`with open(...)`), DB connections, locks and so on.
  starter_code: |
    import os
    from collections.abc import Iterator
    from contextlib import contextmanager


    @contextmanager
    def override_env(**values: str | None) -> Iterator[None]:
        # Implement here
        raise NotImplementedError
